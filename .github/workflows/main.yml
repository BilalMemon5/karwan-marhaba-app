name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android scaffold
        run: |
          cp -r lib /tmp/lib_bak
          cp pubspec.yaml /tmp/pubspec_bak.yaml
          flutter create --platforms=android --project-name karwan_marhaba --org com.karwanemarhaba .
          rm -rf lib test
          cp -r /tmp/lib_bak lib
          cp /tmp/pubspec_bak.yaml pubspec.yaml
          python3 - <<'PY'
          import re
          f = 'android/app/src/main/AndroidManifest.xml'
          s = open(f, encoding='utf-8').read()
          q = ''.join('<intent><action android:name="android.intent.action.VIEW"/><data android:scheme="%s"/></intent>' % x for x in ('https', 'tel', 'mailto'))
          if '<queries>' in s:
              s = s.replace('<queries>', '<queries>' + q, 1)
          else:
              s = s.replace('<application', '<queries>' + q + '</queries><application', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Karwan-e-Marhaba"', s, count=1)
          open(f, 'w', encoding='utf-8').write(s)
          PY
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: karwan-e-marhaba-apk
          path: build/app/outputs/flutter-apk/app-release.apk
